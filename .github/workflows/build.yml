name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # the release step on tags

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate TypeScript bindings
        # Before the frontend build: Vite imports the generated bindings.
        run: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27 generate bindings -ts -d ./frontend/bindings

      - name: Build the frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Icon and version resource
        run: |
          # The icons step ends in an error once the .ico is written: it goes on
          # to look for build/darwin, which a Windows-only repo does not have.
          # Ignoring the error is the documented behaviour, not a workaround.
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27 generate icons --input build/appicon.png || true
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out rsrc_windows_amd64.syso

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build the exe
        # -H windowsgui is not optional: without it a console window rides along
        # with every launch of the panel.
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o build/bin/wow-hub.exe .

      - name: Zip the release payload
        run: powershell -NoProfile -Command "Compress-Archive -Path build/bin/wow-hub.exe,INSTALL.txt -DestinationPath azeroth-hub.zip -Force"

      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: azeroth-hub-windows
          path: azeroth-hub.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: azeroth-hub.zip
